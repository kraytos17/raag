# git-cliff configuration for Raag's auto-generated CHANGELOG.md.
# See https://git-cliff.org for reference.

[changelog]
header = """# Changelog

All notable changes to Raag are documented here. The format is based on
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and this project
adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

Generated automatically by [git-cliff](https://git-cliff.org) from
Conventional Commits.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
{% if commit.scope %}\
- **{{ commit.scope }}**: {{ commit.message | upper_first }}
{% else %}\
- {{ commit.message | upper_first }}
{% endif %}\
{% endfor %}
{% endfor %}\
"""
template = """
{%- if version %}\
  - [{{ version | trim_start_matches(pat="v") }}](https://github.com/p-society/raag/releases/tag/{{ version }})
{%- endif %}\
"""
footer = """
<!-- generated by git-cliff -->
"""

[git]
conventional_commits = true
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^security", group = "Security" },
    { message = "^docs", group = "Documentation" },
    { message = "^test", group = "Testing" },
    { message = "^ci", group = "CI/CD" },
    { message = "^build", group = "Build" },
    { message = "^deps", group = "Dependencies" },
    { message = "^chore", group = "Chore" },
]
filter_commits = false
# Exclude merge commits and dependency bumps from the per-version body (they
# add noise; dependabot already opens grouped PRs).
skip_merges = true
