name: Deploy
on:
  workflow_run:
    workflows: [Docker]
    branches: [main]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    name: Deploy Tracker to Railway
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.app/install.sh | sh
      - name: Deploy to Railway
        id: deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "::notice::Deploying tracker to Railway..."
          railway up --service=tracker --ci
          echo "url=https://tracker-production.up.railway.app" >> $GITHUB_OUTPUT
      - name: Health check
        if: steps.deploy.outcome == 'success'
        run: |
          echo "Waiting 30s for deployment to stabilize..."
          sleep 30
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://tracker-production.up.railway.app/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "::notice::Health check passed (attempt $i)"
              exit 0
            fi
            echo "::warning::Health check attempt $i failed (HTTP $STATUS), retrying in 10s..."
            sleep 10
          done
          echo "::error::Health check failed after 5 attempts"
          exit 1
