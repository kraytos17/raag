linters:
  disable-all: true
  enable:
    - bodyclose
    - dogsled
    - errcheck
    - funlen
    - goconst
    - gocritic
    - gocyclo
    - gofmt
    - goimports
    - gosimple
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - staticcheck
    - typecheck
    - unconvert
    - unused
    - whitespace

linters-settings:
  lll:
    line-length: 200
  gocyclo:
    min-complexity: 25
  misspell:
    locale: US

issues:
  exclude-use-default: false
  max-issues-per-linter: 50
  max-same-issues: 10

run:
  timeout: 5m
  skip-dirs:
    - vendor
    - proto/gen
  issues-exclude-dirs:
    - vendor
    - proto/gen
