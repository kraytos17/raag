version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - dogsled
    - errcheck
    - funlen
    - goconst
    - gocritic
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    funlen:
      lines: 150
      statements: 120
    gocyclo:
      min-complexity: 25
    lll:
      line-length: 200
    misspell:
      locale: US
  exclusions:
    generated: lax
    rules:
      - linters:
          - unused
        path: _test\.go
      - linters:
          - unused
        path: internal/infra/p2p/fsm\.go
      - linters:
          - unused
        path: internal/infra/p2p/streaming_fsm\.go
      - linters:
          - unused
        path: internal/app/circuit_breaker\.go
    paths:
      - vendor
      - proto/gen
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - vendor
      - proto/gen
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
