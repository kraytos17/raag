version: 2
project_name: raag
metadata:
  description: A peer-to-peer music streaming application
  homepage: https://github.com/p-society/raag
  repository_url: https://github.com/p-society/raag
  license: Apache-2.0
before:
  hooks:
    - go mod tidy
    - go generate ./...
variables:
  version: "{{.Version}}"
  build_time: "{{.Date}}"
  commit: "{{.Commit}}"
builds:
  - id: raag
    main: ./cmd/raag
    binary: raag
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Env.version}}
      - -X main.buildTime={{.Env.build_time}}
      - -X main.commit={{.Env.commit}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    mod_timestamp: "{{.CommitTimestamp}}"
  - id: tracker
    main: ./tracker/cmd/tracker
    binary: tracker
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Env.version}}
      - -X main.buildTime={{.Env.build_time}}
      - -X main.commit={{.Env.commit}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    mod_timestamp: "{{.CommitTimestamp}}"
archives:
  - id: raag
    builds:
      - raag
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md
    wrap_in_directory: false
  - id: tracker
    builds:
      - tracker
    name_template: "tracker_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md
    wrap_in_directory: false
checksum:
  name_template: checksums.txt
  algorithm: sha256
  ids:
    - raag
    - tracker
changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^test:"
      - Merge pull request
      - Merge branch
      - Bump dependencies
  groups:
    - title: "🚀 New Features"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: "⚡ Performance"
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: "🔧 Refactoring"
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: "📚 Documentation"
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 4
    - title: "🔒 Security"
      regexp: '^.*?security(\([[:word:]]+\))??!?:.+$'
      order: 5
    - title: "🛠️ Other Changes"
      order: 999
release:
  github:
    owner: p-society
    name: raag
  draft: false
  prerelease: auto
  mode: append
  name_template: "{{ .ProjectName }} v{{ .Version }}"
  header: |
    ## 🎵 {{ .ProjectName }} v{{ .Version }}

    **Released on {{ .Date }}**

    ### 📦 Downloads

    Download the binaries for your platform from the assets below.

    ### 🔐 Verify Checksums

    ```bash
    sha256sum -c checksums.txt
    ```

    ### 📋 What's Changed
  footer: |
    ---

    **Full Changelog**: https://github.com/p-society/raag/compare/{{ .PreviousTag }}...{{ .Tag }}

    ---

    <p align="center">
      <a href="https://github.com/p-society/raag">⭐ Star this project</a> |
      <a href="https://github.com/p-society/raag/issues">🐛 Report a bug</a> |
      <a href="https://github.com/p-society/raag/discussions">💬 Discussions</a>
    </p>
milestones:
  - close: true
signs:
  - artifacts: checksum
    cmd: gpg
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
    ids:
      - raag
      - tracker
    signature: "${artifact}.sig"
