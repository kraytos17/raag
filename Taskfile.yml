version: "3"
tasks:
  build:
    desc: Build all binaries
    cmds:
      - mkdir -p bin
      - go build -ldflags="-s -w" -o bin/raag ./cmd/raag
      - go build -ldflags="-s -w" -o bin/raagd ./cmd/raagd
  build:raag:
    desc: Build CLI client
    cmds:
      - go build -ldflags="-s -w" -o bin/raag ./cmd/raag
  build:raagd:
    desc: Build daemon
    cmds:
      - go build -ldflags="-s -w" -o bin/raagd ./cmd/raagd
  dev:
    desc: Run daemon with hot-reload
    cmds:
      - air -c .air.toml
  run:daemon:
    desc: Run daemon directly
    cmds:
      - go run ./cmd/raagd
  run:cli:
    desc: Run CLI directly
    cmds:
      - go run ./cmd/raag
  test:
    desc: Run tests with race detector
    cmds:
      - go test -race -cover ./...
  test:short:
    desc: Run tests (no race detector)
    cmds:
      - go test ./...
  test:coverage:
    desc: Run tests with coverage report
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out
  test:bench:
    desc: Run benchmarks
    cmds:
      - go test -bench=. -benchmem ./...
  lint:
    desc: Format and lint code
    cmds:
      - go fmt ./...
      - go vet ./...
      - golangci-lint run ./...
  lint:fix:
    desc: Auto-fix linting issues
    cmds:
      - go fmt ./...
      - golangci-lint run --fix ./...
  lint:ci:
    desc: Lint for CI
    cmds:
      - golangci-lint run --out-format=github-actions ./...
  sec:
    desc: Run security scanners (gosec, govulncheck, trivy)
    cmds:
      - gosec ./...
      - govulncheck ./...
      - trivy fs --security-checks vuln,config ./
  generate:
    desc: Generate code (proto + mocks)
    cmds:
      - mkdir -p proto/gen
      - protoc --go_out=proto/gen --go_opt=paths=source_relative --go-grpc_out=proto/gen --go-grpc_opt=paths=source_relative -Iproto proto/raag.proto
      - mockgen -source=internal/app/interfaces.go -destination=internal/app/mocks/mocks.go -package=mocks 2>/dev/null || true
  daemon:start:
    desc: Start daemon
    cmds:
      - ./bin/raagd
  daemon:start:detach:
    desc: Start daemon in background
    cmds:
      - nohup ./bin/raagd > raagd.log 2>&1 &amp; echo $! > raagd.pid
  daemon:stop:
    desc: Stop daemon
    cmds:
      - pkill raagd || true
  daemon:status:
    desc: Check daemon status
    cmds:
      - ./bin/raag status || echo "Daemon not running"
  docker:build:
    desc: Build Docker image
    cmds:
      - docker build -t raag:1.0.0 .
  docker:run:
    desc: Run Docker container
    cmds:
      - docker run -d --name raag -p 7844:7844 -v ~/Music:/music raag:1.0.0
  docker:stop:
    desc: Stop Docker container
    cmds:
      - docker stop raag || true
  dev:setup:
    desc: Setup dev environment
    cmds:
      - task install
      - task deps
      - task generate
  deps:
    desc: Tidy and verify dependencies
    cmds:
      - go mod tidy
      - go mod verify
  install:
    desc: Install dev tools
    cmds:
      - go install github.com/cosmtrek/air@latest
      - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - go install github.com/securego/gosec/v2/cmd/gosec@latest
      - go install github.com/aquasecurity/trivy@latest
      - go install golang.org/x/vuln/cmd/govulncheck@latest
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
      - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      - go install github.com/bufbuild/buf/cmd/buf@latest
      - echo "Done"
  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin/ coverage.out coverage.html raagd.log raagd.pid
  ci:
    desc: Full CI pipeline
    cmds:
      - go vet ./...
      - go test -race ./...
      - golangci-lint run --out-format=github-actions ./...
      - mkdir -p bin && go build -o bin/raag ./cmd/raag && go build -o bin/raagd ./cmd/raagd
  release:
    desc: Build release binaries
    cmds:
      - goreleaser release --clean --skip-publish 2>/dev/null || echo "goreleaser not configured"
  help:
    desc: List all tasks
    cmds:
      - task --list
