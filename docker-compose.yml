version: "3.8"
services:
  tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raag-tracker
    ports:
      - "8080:8080"
      - "45678:45678"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - raag-network
networks:
  raag-network:
    driver: bridge
