services:
  raag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raag-node
    ports:
      - "${LIBP2P_PORT:-45678}:${LIBP2P_PORT:-45678}"
    environment:
      LIBP2P_PORT: "${LIBP2P_PORT:-45678}"
      DATA_DIR: "${DATA_DIR:-/home/raag/data}"
      MUSIC_DIR: "${MUSIC_DIR:-/home/raag/music}"
      AUTH_SECRET: "${AUTH_SECRET:-}"
      DHT: "${DHT:-true}"
      MDNS: "${MDNS:-true}"
      MAX_PEERS: "${MAX_PEERS:-50}"
      RENDEZVOUS: "${RENDEZVOUS:-raag-v1}"
    volumes:
      - raag-data:/home/raag/data
      - music:/home/raag/music
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - raag-network

volumes:
  raag-data:
  music:

networks:
  raag-network:
    driver: bridge
