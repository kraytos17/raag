services:
  raagd:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raag-daemon
    ports:
      - "7844:7844/tcp"
      - "7844:7844/udp"
      - "7845:7845/udp"
    environment:
      RAAG_DATA_DIR: "${RAAG_DATA_DIR:-/home/raag/.local/share/raag}"
      RAAG_SOCKET: "${RAAG_SOCKET:-/home/raag/.local/share/raag/raag.sock}"
      RAAG_MUSIC: "${RAAG_MUSIC:-/music}"
      # Optional overrides:
      # RAAG_NO_SCAN: "true"
      # RAAG_DATA_DIR_OVERRIDE: "/home/raag/.local/share/raag"
    volumes:
      - "./config:/home/raag/.config/raag"
      - "${MUSIC_DIR:-~/Music}:/music"
      - raag-data:/home/raag/.local/share/raag
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "./raag", "--socket", "/home/raag/.local/share/raag/raag.sock", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - raag-network

volumes:
  raag-data:

networks:
  raag-network:
    driver: bridge
