syntax = "proto3";

package raag;

option go_package = "github.com/p-society/raag/proto/gen";

message Track {
  string id = 1;
  string path = 2;
  string title = 3;
  string normalized_title = 27;
  string artist = 4;
  string normalized_artist = 28;
  string album_artist = 5;
  string album = 6;
  string normalized_album = 29;
  uint32 track_number = 7;
  uint32 disc_number = 8;
  uint32 year = 9;
  repeated string genres = 10;
  uint64 duration_ms = 11;
  uint64 size_bytes = 12;
  string mime_type = 13;
  string codec = 14;
  uint32 bitrate = 15;
  uint32 sample_rate = 16;
  uint32 channels = 17;
  string lyrics = 18;
  int64 added_at = 20;
  int64 modified_at = 21;
  uint64 play_count = 22;
  int64 last_played = 23;
  string content_hash = 26;
  bool is_duplicate = 30;
  string duplicate_of = 31;
  string peer_id = 32;
}

message Playlist {
  string id = 1;
  string name = 2;
  repeated string track_ids = 3;
  int64 created_at = 4;
  int64 modified_at = 5;
}

message PeerCapabilities {
  repeated string supported_codecs = 1;
  repeated int32 supported_bitrates = 2;
  bool can_transcode = 3;
  int64 upload_bandwidth = 4;
  string protocol_version = 5;
}

message PeerScore {
  string peer_id = 1;
  double avg_latency_ms = 2;
  int64 avg_bandwidth = 3;
  int32 failure_count = 4;
  int32 success_count = 5;
  int64 last_seen = 6;
  double score = 7;
}

message LibraryManifest {
  string peer_id = 1;
  int64 timestamp = 2;
  repeated string track_ids = 3;
}

message FileStat {
  string path = 1;
  int64 mtime = 2;
  int64 size = 3;
}

message Empty {}

message Request {
  string request_id = 1;
  int32 protocol_version = 2;
  oneof payload {
    PlayRequest play = 4;
    PauseRequest pause = 5;
    ResumeRequest resume = 6;
    StopRequest stop = 7;
    NextRequest next = 8;
    PrevRequest prev = 9;
    SeekRequest seek = 10;
    SetVolumeRequest set_volume = 11;
    QueueAddRequest queue_add = 12;
    QueueRemoveRequest queue_remove = 13;
    QueueClearRequest queue_clear = 14;
    SearchRequest search = 15;
    LibScanRequest lib_scan = 16;
    ListPeersRequest list_peers = 17;
    StatusRequest status = 18;
    HealthCheckRequest health_check = 19;
    CreatePlaylistRequest create_playlist = 20;
    GetPlaylistRequest get_playlist = 21;
    ListPlaylistsRequest list_playlists = 22;
    AddToPlaylistRequest add_to_playlist = 23;
    GetTrackRequest get_track = 24;
    GetTrackByPathRequest get_track_by_path = 25;
    NetworkStatusRequest network_status = 26;
    BanPeerRequest ban_peer = 27;
    UnbanPeerRequest unban_peer = 28;
    SubscribeRequest subscribe = 29;
    UnsubscribeRequest unsubscribe = 30;
    ListTracksRequest list_tracks = 31;
    QueueListRequest queue_list = 32;
    QueueShuffleRequest queue_shuffle = 33;
    QueueRepeatRequest queue_repeat = 34;
    QueueModeRequest queue_mode = 35;
  }
}

message Response {
  string request_id = 1;
  bool success = 2;
  string error = 3;
  string job_id = 4;
  oneof payload {
    SearchResponse search = 6;
    ListPeersResponse list_peers = 7;
    StatusResponse status = 8;
    HealthCheckResponse health_check = 9;
    GetTrackResponse get_track = 11;
    GetPlaylistResponse get_playlist = 12;
    ListPlaylistsResponse list_playlists = 13;
    NetworkStatusResponse network_status = 14;
    ScanProgress scan_progress = 15;
    CreatePlaylistResponse create_playlist = 16;
    AddToPlaylistResponse add_to_playlist = 17;
    Empty ban_peer = 18;
    Empty unban_peer = 19;
    ListTracksResponse list_tracks = 21;
    QueueListResponse queue_list = 22;
    QueueModeResponse queue_mode = 23;
  }
}

message PlayRequest {
  string track_id = 1;
  string query = 2;
}

message StatusResponse {
  string state = 1;
  Track current_track = 2;
  int64 position_ms = 3;
  int32 volume = 4;
  int32 queue_length = 5;
  int32 queue_position = 6;
  float buffer_fill = 7;
}

message StatusRequest {}

message PauseRequest {}

message ResumeRequest {}

message StopRequest {}

message NextRequest {}

message PrevRequest {}

message SeekRequest {
  int64 offset_ms = 1;
}

message SetVolumeRequest {
  int32 volume = 1;
}

message QueueAddRequest {
  string track_id = 1;
  int32 position = 2;
}

message QueueRemoveRequest {
  int32 position = 1;
}

message QueueClearRequest {}

message QueueResponse {
  repeated Track tracks = 1;
}

message ListTracksRequest {
  int32 offset = 1;
  int32 limit = 2;
}

message ListTracksResponse {
  repeated Track tracks = 1;
  int32 total = 2;
}

message QueueListRequest {}

message QueueListResponse {
  repeated Track tracks = 1;
}

message QueueShuffleRequest {
  bool shuffle = 1;
}

message QueueRepeatRequest {
  string mode = 1; // "", "all", "one"
}

message QueueModeRequest {}

message QueueModeResponse {
  bool shuffle = 1;
  string repeat = 2;
}

message SearchRequest {
  string query = 1;
  int32 limit = 2;
  bool include_peers = 4;
}

message SearchResponse {
  repeated Track tracks = 1;
  int32 total = 2;
}

message LibScanRequest {
  bool incremental = 1;
}

message ScanProgress {
  string job_id = 1;
  int32 scanned = 2;
  int32 total = 3;
  string current_file = 4;
  string phase = 5;
}

message Peer {
  string id = 1;
  repeated string addrs = 2;
  bool connected = 3;
  PeerScore score = 4;
  PeerCapabilities capabilities = 5;
}

message ListPeersRequest {}

message ListPeersResponse {
  repeated Peer peers = 1;
}

message HealthCheckRequest {}

message HealthCheckResponse {
  bool healthy = 1;
}

message NetworkStatusRequest {}

message BanPeerRequest {
  string peer_id = 1;
}

message UnbanPeerRequest {
  string peer_id = 1;
}

message NetworkStatusResponse {
  string peer_id = 1;
  repeated string listen_addrs = 2;
  repeated ConnectedPeer connected_peers = 3;
  repeated ConnectedPeer discovered_peers = 4;
}

message ConnectedPeer {
  string peer_id = 1;
  repeated string addrs = 2;
  bool dialable = 3;
}

message CreatePlaylistRequest {
  string name = 1;
}

message CreatePlaylistResponse {
  string playlist_id = 1;
  string name = 2;
}

message GetPlaylistRequest {
  string playlist_id = 1;
}

message GetPlaylistResponse {
  Playlist playlist = 1;
  repeated Track tracks = 2;
}

message ListPlaylistsRequest {}

message ListPlaylistsResponse {
  repeated Playlist playlists = 1;
}

message AddToPlaylistRequest {
  string playlist_id = 1;
  string track_id = 2;
}

message AddToPlaylistResponse {
  string playlist_id = 1;
  int32 track_count = 2;
}

message GetTrackRequest {
  string track_id = 1;
}

message GetTrackByPathRequest {
  string path = 1;
}

message GetTrackResponse {
  Track track = 1;
}

message ChunkRequest {
  string track_id = 1;
  int64 offset = 2;
  int32 length = 3;
  string codec = 4;
  int32 bitrate = 5;
}

message ChunkResponse {
  string track_id = 1;
  int64 offset = 2;
  bytes data = 3;
  bool last_chunk = 4;
  int64 total_size = 5;
  string mime_type = 6;
  string error = 7;
}

message SyncRequest {
  oneof payload {
    ManifestRequest manifest_request = 1;
    TrackDetailRequest track_detail_request = 2;
    CapabilitiesRequest capabilities_request = 3;
    RemoteSearchRequest remote_search_request = 4;
  }
}

message ManifestRequest {}

message TrackDetailRequest {
  string track_id = 1;
}

message CapabilitiesRequest {}

message RemoteSearchRequest {
  string query = 1;
  int32 limit = 2;
}

message SyncResponse {
  oneof payload {
    LibraryManifest manifest = 1;
    Track track = 2;
    PeerCapabilities capabilities = 3;
    ErrorResponse error = 4;
    SearchResult search = 5;
  }
}

message SearchResult {
  repeated Track tracks = 1;
}

message ErrorResponse {
  string message = 1;
  ErrorCode code = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_TRACK_NOT_FOUND = 1;
  ERROR_CODE_PERMISSION_DENIED = 2;
  ERROR_CODE_UNAUTHORIZED = 5;
  ERROR_CODE_RATE_LIMITED = 3;
  ERROR_CODE_TRANSCODE_FAILED = 4;
}

// Event types for subscription
enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_PLAYBACK_STATE = 1; // string: "playing", "paused", "stopped"
  EVENT_TYPE_TRACK_CHANGED = 2; // Track
  EVENT_TYPE_PROGRESS = 4; // ProgressEvent (lightweight)
  EVENT_TYPE_VOLUME_CHANGED = 8; // int32 volume
  EVENT_TYPE_QUEUE_UPDATED = 16; // QueueResponse
  EVENT_TYPE_PEER_CONNECTED = 32; // Peer
  EVENT_TYPE_PEER_DISCONNECTED = 64; // string peer_id
  EVENT_TYPE_LIBRARY_UPDATED = 128; // LibraryStats
  EVENT_TYPE_ERROR = 256; // string error message
  EVENT_TYPE_PEER_SCORE_UPDATED = 512; // Peer (score refreshed)
}

// Lightweight progress event - only position and duration
message ProgressEvent {
  int64 position_ms = 1;
  int64 duration_ms = 2;
}

// Subscribe to events
message SubscribeRequest {
  uint32 event_mask = 1; // Bitmask of EventType values
}

// Unsubscribe from events
message UnsubscribeRequest {}

// Event pushed from server to client
message Event {
  EventType event_type = 1;
  bytes payload = 2;
  int64 timestamp = 3;
}
